[project]
name = "devpilot-backend"
version = "0.1.0"
description = "DevPilot: an autonomous multi-agent AI engineering guild"
requires-python = ">=3.12"

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
pythonpath = ["."]

[tool.ruff]
line-length = 120
target-version = "py312"
